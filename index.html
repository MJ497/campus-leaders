<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 — Page Not Found</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--muted:#94a3b8;--accent:#60a5fa}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial;background:linear-gradient(180deg,var(--bg),#07080b);color:#e6eef8}
    .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:40px}
    .card{max-width:880px;width:100%;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.03);padding:48px;border-radius:12px;backdrop-filter:blur(6px);display:flex;gap:32px;align-items:center}
    .num{font-size:96px;font-weight:700;color:var(--accent);line-height:1}
    .info h1{margin:0 0 8px;font-size:28px}
    .info p{margin:0 0 18px;color:var(--muted)}
    .actions{display:flex;gap:12px}
    a.btn{display:inline-block;padding:10px 16px;border-radius:8px;text-decoration:none;color:#081126;background:var(--accent);font-weight:600}
    a.ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted)}
    footer{margin-top:18px;color:rgba(230,238,248,0.6);font-size:13px}
    @media(max-width:640px){.card{flex-direction:column;text-align:center}.num{font-size:72px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="num">404</div>
      <div class="info">
        <h1>Page not found</h1>
        <p>Sorry — the page you were looking for doesn't exist or has been moved.</p>
       
        <footer>If you reached this from a link here, please contact the site administrator.</footer>
      </div>
    </div>
  </div>
</body>
</html>
